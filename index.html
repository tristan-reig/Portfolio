<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      html,
      body {
        margin: 0;
        background: #cbcbd0;
      }

      #chargement {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #cbcbd0;
        transition: opacity 0.6s ease;
      }

      #chargement.fini {
        opacity: 0;
        pointer-events: none;
      }

      #chargement .bloc {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 10px 20px 10px 24px;
        background: #000;
        color: #fff;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 18px;
        line-height: 1;
      }

      #chargement-pourcent {
        white-space: pre;
        font-variant-numeric: tabular-nums;
      }

      #chargement .curseur {
        width: 0.6em;
        height: 1em;
        background: #fff;
        animation: clignote 1s steps(1) infinite;
      }

      @keyframes clignote {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #chargement {
          transition: none;
        }

        #chargement .curseur {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="chargement" role="status">
      <div class="bloc">
        Chargement
        <span id="chargement-pourcent"></span>
        <span class="curseur" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
